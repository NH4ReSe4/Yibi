name: Publish APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      YIBI_KEYSTORE_FILE: ${{ github.workspace }}/app/yibi-release.jks
      YIBI_KEYSTORE_PASSWORD: ${{ secrets.YIBI_KEYSTORE_PASSWORD }}
      YIBI_KEY_ALIAS: ${{ secrets.YIBI_KEY_ALIAS }}
      YIBI_KEY_PASSWORD: ${{ secrets.YIBI_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.YIBI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$YIBI_KEYSTORE_FILE"

      - name: Verify and build release
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintRelease assembleRelease

      - name: Prepare update metadata
        shell: bash
        run: |
          VERSION_CODE=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)
          VERSION_NAME=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test "$GITHUB_REF_NAME" = "v$VERSION_NAME"
          APK_NAME="yibi-${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          SHA256=$(sha256sum "$APK_NAME" | cut -d ' ' -f 1)
          RELEASE_NOTES=$(git log -1 --pretty=%s)
          export VERSION_CODE VERSION_NAME APK_NAME SHA256 RELEASE_NOTES
          python3 - <<'PY'
          import json
          import os

          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          apk_name = os.environ["APK_NAME"]
          manifest = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "apkUrl": f"https://github.com/{repository}/releases/download/{tag}/{apk_name}",
              "sha256": os.environ["SHA256"],
              "releaseNotes": os.environ["RELEASE_NOTES"],
              "forceUpdate": False,
          }
          with open("update.json", "w", encoding="utf-8") as output:
              json.dump(manifest, output, ensure_ascii=False, indent=2)
              output.write("\n")
          PY
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$APK_NAME" update.json --generate-notes --title "一笔 ${GITHUB_REF_NAME}"
